name: E2E Pilot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  pilot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recafe_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recafe_e2e?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: test-jwt-access-secret-minimum-32-characters-ci
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-minimum-32-characters-ci
      CORS_ORIGIN: http://localhost:5173
      SUPPORT_API_KEY: e2e-pilot-support-api-key
      NODE_ENV: development
      PLAYWRIGHT_SKIP_WEBSERVER: '1'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate
      - run: pnpm --filter api exec prisma db push
      - run: pnpm --filter api run prisma:seed
      - name: Start servers and run pilot Playwright
        run: |
          pnpm --filter api run start:dev &
          pnpm --filter ops-web run dev &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3000/api/v1/health/live && curl -sf http://127.0.0.1:5173/; then
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Servers failed to become ready"
              exit 1
            fi
            sleep 2
          done
          pnpm --filter ops-web run test:e2e:pilot
          pnpm --filter ops-web run test:e2e:critical
