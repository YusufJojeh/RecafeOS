# Local development dependencies only (Postgres, Redis, MinIO).
# Do not use default passwords in production — see deploy/docker-compose.stack.yml and docs/operations/DEPLOYMENT_DEVOPS.md

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restocafe
      POSTGRES_PASSWORD: restocafe
      POSTGRES_DB: restocafe
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restocafe -d restocafe"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
